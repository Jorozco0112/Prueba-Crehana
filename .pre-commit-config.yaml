# Runs the same tool versions pinned in uv.lock (DEC-040).
# Install once with: uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run black
        language: system
        types: [python]
      - id: isort
        name: isort
        entry: uv run isort
        language: system
        types: [python]
      - id: flake8
        name: flake8
        entry: uv run flake8
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
