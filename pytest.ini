[pytest]
testpaths = tests
markers =
    unit: fast tests without external dependencies (domain and use cases)
    integration: tests that need PostgreSQL (repositories and HTTP API)
addopts =
    -ra
    --strict-markers
    --strict-config
    --cov=app
    --cov-branch
    --cov-report=term-missing
    --cov-fail-under=75
