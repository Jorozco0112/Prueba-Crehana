[project]
name = "crehana-todo-api"
version = "1.0.0"
description = "REST API to manage task lists and tasks, built with FastAPI and a layered architecture."
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16",
    "argon2-cffi>=25.1",
    "email-validator>=2.2",
    "fastapi>=0.120",
    "psycopg[binary]>=3.2",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "pyjwt>=2.10",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.40",
    "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
    "black>=25.1",
    "flake8>=7.3",
    "httpx2>=2.13.1",
    "isort>=6.0",
    "mypy>=1.17",
    "pre-commit>=4.2",
    "pytest>=8.4",
    "pytest-cov>=6.2",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.isort]
profile = "black"
known_first_party = ["app", "tests"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "migrations"]

[[tool.mypy.overrides]]
# Test helpers and fixtures do not need full annotations.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
]
